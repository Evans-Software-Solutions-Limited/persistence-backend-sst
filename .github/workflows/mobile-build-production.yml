name: Mobile Build (Production → App Store / Google Play)

# ⚠ MANUAL ONLY (Brad's decision, 2026-08-14). The `release: published` trigger
# is DELIBERATELY DISABLED: merging the release-please chore publishes a GitHub
# Release, which would otherwise auto-run an EAS build here (with `submit: true`)
# and burn Expo build quota / risk charges on every production release. Mobile
# binaries are cut deliberately, not on every backend/web release. Run this via
# `workflow_dispatch` (Actions → this workflow → Run workflow) when you actually
# want a store build, choosing platform + whether to submit.
#
# `production-deploy.yml` still fires on `release: published` — that deploys the
# SST backend + web static site only, and does NOT build mobile.
#
# The `github.event_name == 'release'` conditions in the jobs below are now
# dead (harmless) and kept only so re-enabling is a one-line uncomment.
on:
  # release:
  #   types: [published]
  workflow_dispatch:
    inputs:
      platform:
        description: "Which platform to build"
        required: true
        type: choice
        options: [ios, android, all]
        default: ios
      submit:
        description: "Submit to the selected store after build?"
        required: true
        type: boolean
        default: true

concurrency:
  group: mobile-build-production-${{ github.event.inputs.platform || 'all' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build + Submit to Store
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 60
    defaults:
      run:
        working-directory: packages/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install Expo + EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS (EAS)
        id: ios_build
        if: ${{ github.event_name == 'release' || github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'all' }}
        run: |
          build_json="$(eas build \
            --platform ios \
            --profile production \
            --non-interactive \
            --wait \
            --json)"
          build_id="$(jq -er '.[0].id' <<<"$build_json")"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"

      - name: Build Android (EAS)
        id: android_build
        if: ${{ github.event_name == 'release' || github.event.inputs.platform == 'android' || github.event.inputs.platform == 'all' }}
        run: |
          build_json="$(eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --wait \
            --json)"
          build_id="$(jq -er '.[0].id' <<<"$build_json")"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"

      - name: Submit to App Store (iOS)
        # Release events: always submit both platforms after release-please publishes.
        # Manual dispatch: respect the `submit` input + platform choice.
        # Auth: EAS uses the App Store Connect API key registered globally via
        # `eas credentials` (one-time local setup) — no per-run secrets needed.
        if: ${{ github.event_name == 'release' || (github.event.inputs.submit != 'false' && (github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'all')) }}
        run: |
          eas submit \
            --platform ios \
            --profile production \
            --id "${{ steps.ios_build.outputs.build_id }}" \
            --non-interactive \
            --wait

      - name: Submit to Google Play (Android draft)
        # Turn this repository variable on only after the EAS Google Play service
        # account credential has been installed and verified. Until then, release
        # events still produce the Android AAB without creating a partial release.
        if: ${{ vars.GOOGLE_PLAY_SUBMIT_ENABLED == 'true' && (github.event_name == 'release' || (github.event.inputs.submit != 'false' && (github.event.inputs.platform == 'android' || github.event.inputs.platform == 'all'))) }}
        run: |
          eas submit \
            --platform android \
            --profile production \
            --id "${{ steps.android_build.outputs.build_id }}" \
            --non-interactive \
            --wait
