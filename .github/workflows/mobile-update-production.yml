name: Mobile OTA Update (Production channel)

# MANUAL ONLY. Publishes a JS-only over-the-air update to the `production`
# EAS Update channel, reaching existing App Store installs on their next launch
# (no store review). Run via Actions → this workflow → Run workflow.
#
# WHY THIS EXISTS (incident 2026-08-16): a production OTA was once published
# from a laptop, where `eas update` picked up the local, git-ignored
# `packages/mobile/.env` (which holds STAGING urls) and baked staging config
# into the production channel — pointing the live app at the staging database.
# CI has no local `.env`, and this workflow sources the public `EXPO_PUBLIC_*`
# config straight from `eas.json`'s `build.production.env` (the SAME block
# `eas build --profile production` uses), then hard-guards that the Supabase url
# is the production project before publishing. A staging url aborts the run.
#
# Native/binary changes still go through `mobile-build-production.yml` + a store
# submission — OTA only ships JS/asset changes compatible with the shipped
# runtimeVersion.

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Update message (shown in EAS dashboard / update history)"
        required: true
        type: string

concurrency:
  group: mobile-update-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    name: Publish OTA to production channel
    runs-on: ubuntu-latest
    # Same GitHub environment as the production build — carries EXPO_TOKEN and
    # any environment protection rules.
    environment: Production
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install Expo + EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Load production client config from eas.json
        # Exports the committed `build.production.env` block into the shell so the
        # guard below can sanity-check it. NOTE: this is NOT the whole story —
        # `eas update --environment production` (the publish step) also pulls
        # EXPO_PUBLIC_* from the EAS SERVER-SIDE environment store, which takes
        # precedence for any var defined there. That store — not eas.json — is
        # the source that actually gets baked, which is why the second guard
        # below is the load-bearing one.
        run: |
          jq -r '.build.production.env | to_entries[] | "\(.key)=\(.value)"' eas.json >> "$GITHUB_ENV"

      - name: Guard — eas.json config is production
        # Necessary but NOT sufficient (see next step): eas.json is what a build
        # uses; an update uses the EAS store.
        run: |
          echo "Supabase: $EXPO_PUBLIC_SUPABASE_URL"
          echo "API:      $EXPO_PUBLIC_API_URL"
          case "$EXPO_PUBLIC_SUPABASE_URL" in
            *opcvjypsoivaxerahbal*) : ;;
            *) echo "::error::eas.json EXPO_PUBLIC_SUPABASE_URL is not the production project ($EXPO_PUBLIC_SUPABASE_URL) — aborting."; exit 1 ;;
          esac
          case "$EXPO_PUBLIC_API_URL" in
            *staging*) echo "::error::eas.json EXPO_PUBLIC_API_URL points at staging ($EXPO_PUBLIC_API_URL) — aborting."; exit 1 ;;
            https://api.persistence.evans-software-solutions.com*) : ;;
            *) echo "::error::eas.json EXPO_PUBLIC_API_URL is not the production api ($EXPO_PUBLIC_API_URL) — aborting."; exit 1 ;;
          esac
          echo "eas.json config verified."

      - name: Guard — EAS server-side production env store is production
        # THE load-bearing guard (added after the 2026-08-16 outage). `eas update
        # --environment production` inlines EXPO_PUBLIC_* from the EAS server-side
        # store, which overrides eas.json. That store had been left pointing at a
        # DEAD Supabase project (dfeyebgdktfteqlacmru), so every CI OTA baked the
        # wrong Supabase and auth-broke prod while the eas.json guard passed.
        # Validate the ACTUAL source here, and reject any known non-prod project.
        run: |
          store="$(eas env:list production 2>/dev/null || true)"
          echo "$store" | grep -E '^EXPO_PUBLIC_(SUPABASE_URL|API_URL)=' || true
          if ! echo "$store" | grep -q '^EXPO_PUBLIC_SUPABASE_URL=https://opcvjypsoivaxerahbal.supabase.co$'; then
            echo "::error::EAS 'production' env store EXPO_PUBLIC_SUPABASE_URL is not the prod project. Fix with 'eas env' before publishing."; exit 1
          fi
          if echo "$store" | grep -qE '^EXPO_PUBLIC_(SUPABASE_URL|API_URL)=.*(staging|nxkhlrvjxotyjulodxzk|dfeyebgdktfteqlacmru)'; then
            echo "::error::EAS 'production' env store contains a non-prod URL — aborting."; exit 1
          fi
          echo "EAS production env store verified."

      - name: Publish OTA update
        env:
          # `eas update` runs `expo export` for all platforms with sourcemaps +
          # assetmaps; this app's bundle overflows Node's default ~2GB heap and
          # aborts (SIGABRT / "Reached heap limit"). ubuntu-latest has ~16GB RAM,
          # so give the bundler a generous heap. Propagates to the expo/Metro
          # child process.
          NODE_OPTIONS: --max-old-space-size=8192
          # Passed via env (not string-interpolated into the script) so an
          # arbitrary message can't break quoting or inject shell.
          UPDATE_MESSAGE: ${{ inputs.message }}
        run: |
          eas update \
            --branch production \
            --environment production \
            --message "$UPDATE_MESSAGE" \
            --non-interactive
