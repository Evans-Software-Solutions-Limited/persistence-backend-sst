apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.togethernearby'
version = '0.1.0'

android {
  namespace 'expo.modules.togethernearby'
  // Expo's autolinking plugin reads defaultConfig.versionName while it
  // configures every module; without it the whole Android build fails
  // ("'android.defaultConfig.versionName' is not defined"). Matches the
  // other Together modules.
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies { implementation 'com.google.android.gms:play-services-nearby:19.5.0' }
